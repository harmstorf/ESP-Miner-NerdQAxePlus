name: Build NerdQAxe++ Big Screen

on:
  workflow_dispatch:
  push:
    branches: [bigscreen]

permissions:
  contents: read

jobs:
  standard-build:
    # Compile without DISPLAY_PROFILE to catch regressions in the stock target.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build unchanged standard NerdQAxe++ target
        run: |
          docker run --rm --user root \
            -e BOARD=NERDQAXEPLUS2 \
            -v "$PWD:/home/builder/project" \
            shufps/esp-idf-builder:0.0.1 \
            idf.py set-target esp32s3 build

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check minimal adaptation scope
        run: |
          python3 test/check_bigscreen_scope.py
          python3 -m unittest discover -s test -p 'test_bigscreen_*.py'

      - name: Build 480x320 firmware
        run: |
          set -euo pipefail
          BASE_VERSION="$(tr -d '\n' < UPSTREAM_VERSION)"
          [[ "$BASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          COMMIT_HASH="$(git rev-parse --short=8 HEAD)"
          BUILD_VERSION="${BASE_VERSION}-bigscreen-${COMMIT_HASH}"
          echo "$BUILD_VERSION" > version.txt
          sed -i "s|__VERSION__|${BUILD_VERSION}|g; s|__COMMIT__|${COMMIT_HASH}|g" main/http_server/axe-os/src/app/app.module.ts
          for file in main/http_server/axe-os/src/assets/i18n/*.json; do
            mv "$file" "${file%.json}.${COMMIT_HASH}.json"
          done
          docker run --rm --user root \
            -e BOARD=NERDQAXEPLUS2 \
            -e DISPLAY_PROFILE=YYSLUPING_480X320 \
            -v "$PWD:/home/builder/project" \
            shufps/esp-idf-builder:0.0.1 \
            idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.yysluping.defaults" set-target esp32s3 build

      - name: Verify OTA image fits its 5 MiB slot
        run: |
          test "$(stat -c %s build/esp-miner.bin)" -le 5242880

      - name: Create 32 MiB factory image
        run: |
          BASE_VERSION="$(tr -d '\n' < UPSTREAM_VERSION)"
          docker run --rm --user root \
            -v "$PWD:/home/builder/project" \
            shufps/esp-idf-builder:0.0.1 \
            esptool.py --chip esp32s3 merge_bin \
            --flash_mode dio --flash_size 32MB --flash_freq 80m \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/esp-miner.bin \
            0xf10000 build/ota_data_initial.bin \
            0x1000000 build/www.bin \
            -o esp-miner-factory-NerdQAxe++-BigScreen-FullFlash-${BASE_VERSION}.bin

          # The firmware's one-click updater consumes a compact stream bundle:
          # 64 KiB header, 5 MiB padded application slot, then 3 MiB web UI.
          docker run --rm --user root \
            -v "$PWD:/home/builder/project" \
            shufps/esp-idf-builder:0.0.1 \
            esptool.py --chip esp32s3 merge_bin \
            --flash_mode dio --flash_size 32MB --flash_freq 80m \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/esp-miner.bin \
            0x510000 build/www.bin \
            -o "esp-miner-factory-NerdQAxe++-${BASE_VERSION}.bin"

      - name: Record checksums and sizes
        run: |
          python3 test/verify_bigscreen_artifacts.py --version "$(tr -d '\n' < UPSTREAM_VERSION)" --web-dist main/http_server/axe-os/dist/axe-os > BUILD_INFO.json
          git rev-parse HEAD > SOURCE_COMMIT
          cp build/esp-miner.bin esp-miner-NerdQAxe++-BigScreen.bin
          cp build/www.bin www.bin
          sha256sum esp-miner-*.bin www.bin > SHA256SUMS
          stat -c '%n %s bytes' esp-miner-*.bin www.bin

      - name: Upload verified firmware artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NerdQAxe-PlusPlus-BigScreen
          path: |
            esp-miner-factory-NerdQAxe++-*.bin
            esp-miner-NerdQAxe++-BigScreen.bin
            www.bin
            SHA256SUMS
            BUILD_INFO.json
            SOURCE_COMMIT
            UPSTREAM_COMMIT
            UPSTREAM_VERSION
          retention-days: 14
