name: Prepare upstream stable update
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: upstream-stable
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bigscreen
          fetch-depth: 0
      - name: Prepare candidate and dispatch build
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh api repos/shufps/ESP-Miner-NerdQAxePlus/releases/latest --jq '.tag_name')
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Unsupported stable tag: $tag" >&2
            exit 1
          fi
          git fetch --no-tags https://github.com/shufps/ESP-Miner-NerdQAxePlus.git "refs/tags/$tag"
          upstream_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "$tag is already included in bigscreen." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          candidate="upstream-candidate/$tag"
          # A network failure must not be mistaken for a missing branch.
          candidate_ref=$(git ls-remote --heads origin "refs/heads/$candidate")
          if [[ -n "$candidate_ref" ]]; then
            candidate_sha=$(printf '%s' "$candidate_ref" | cut -f1)
            runs=$(gh run list --workflow bigscreen-build.yml --branch "$candidate" --limit 100 --json headSha,status,conclusion)
            decision=$(printf '%s' "$runs" | python3 test/upstream_candidate.py "$candidate_sha")
            case "$decision" in
              passed)
                echo "$candidate has passed both builds; hardware approval remains required." >> "$GITHUB_STEP_SUMMARY"
                ;;
              wait)
                echo "$candidate build is queued or running." >> "$GITHUB_STEP_SUMMARY"
                ;;
              retry)
                gh workflow run bigscreen-build.yml --ref "$candidate"
                echo "Dispatched missing/failed build for $candidate (bounded automatic retry)." >> "$GITHUB_STEP_SUMMARY"
                ;;
              blocked)
                echo "Candidate $candidate failed three builds. Manual review required; not treating branch existence as success." >&2
                exit 1
                ;;
              *) exit 1 ;;
            esac
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$candidate"
          if ! git merge --no-edit "$upstream_sha"; then
            git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY"
            echo "Merge conflict: hardware adaptation requires review." >&2
            exit 1
          fi
          echo "$tag" > UPSTREAM_VERSION
          echo "$upstream_sha" > UPSTREAM_COMMIT
          git add UPSTREAM_VERSION UPSTREAM_COMMIT
          git diff --cached --quiet || git commit -m "ci: set official base to $tag"
          git push origin "HEAD:refs/heads/$candidate"
          gh workflow run bigscreen-build.yml --ref "$candidate"
          echo "Prepared $candidate from official $tag ($upstream_sha). Build dispatched. Hardware test and explicit promotion required; no miner or release was updated." >> "$GITHUB_STEP_SUMMARY"
